<!doctype html>
<!--
  Source for client/public/og-image.png (the link preview image for LinkedIn, Slack, etc.).
  Regenerate after editing, from the repo root:

  & "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe" --headless=new --disable-gpu `
    --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 `
    --screenshot="$PWD\client\public\og-image.png" "file:///$PWD/design/og-image.html"
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fff8ee;
        --surface: #ffffff;
        --ink: #1d2440;
        --muted: #5d6480;
        --accent: #ff6b4a;
        --sky: #8ecdf7;
        --sun: #ffd166;
        --mint: #7ee0b5;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: var(--accent);
        /* subtle dot grid so the coral frame isn't flat */
        background-image: radial-gradient(rgb(29 36 64 / 0.16) 2px, transparent 2px);
        background-size: 28px 28px;
        font-family: 'DM Sans', sans-serif;
        color: var(--ink);
      }
      .card {
        position: absolute;
        inset: 40px 52px 52px 40px; /* extra room right/bottom for the offset shadow */
        background: var(--bg);
        border: 5px solid var(--ink);
        border-radius: 40px;
        box-shadow: 12px 12px 0 0 var(--ink);
        padding: 64px 72px;
        overflow: hidden;
      }
      h1 {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 800;
        font-size: 120px;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      h1 .dot {
        color: var(--accent);
      }
      .pill {
        display: inline-block;
        margin-top: 22px;
        padding: 6px 26px 10px;
        background: var(--sun);
        border: 4px solid var(--ink);
        border-radius: 22px;
        box-shadow: 6px 6px 0 0 var(--ink);
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 700;
        font-size: 54px;
        letter-spacing: -0.02em;
        transform: rotate(-1.5deg);
      }
      .sub {
        margin-top: 40px;
        font-size: 28px;
        font-weight: 500;
        color: var(--muted);
      }
      .tags {
        display: flex;
        gap: 14px;
        margin-top: 22px;
      }
      .tag {
        padding: 8px 22px;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: var(--surface);
        font-size: 24px;
        font-weight: 700;
      }
      .plane {
        position: absolute;
        right: 56px;
        top: 70px;
        width: 250px;
        transform: rotate(-8deg);
        filter: drop-shadow(8px 8px 0 var(--ink));
      }
      .trail {
        position: absolute;
        left: 690px;
        top: 236px;
        width: 200px;
      }
      .blob {
        position: absolute;
        border: 4px solid var(--ink);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Tyler Will<span class="dot">.is</span></h1>
      <div class="pill">a software engineer</div>

      <p class="sub">8 years building web apps for state agencies &amp; a national lab</p>
      <div class="tags">
        <span class="tag">React</span>
        <span class="tag">TypeScript</span>
        <span class="tag">Playwright</span>
      </div>

      <!-- dashed flight path leading into the plane -->
      <svg class="trail" viewBox="0 0 260 120" fill="none">
        <path
          d="M4 112 C 70 112, 90 40, 150 52 S 230 60, 256 8"
          stroke="#1d2440"
          stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="2 16"
        />
      </svg>

      <svg class="plane" viewBox="0 0 64 64" fill="none">
        <path d="M6 30 58 8 44 56 31 40z" fill="#ffffff" stroke="#1d2440" stroke-width="3" stroke-linejoin="round" />
        <path d="M31 40 58 8 24 35z" fill="#ff6b4a" stroke="#1d2440" stroke-width="3" stroke-linejoin="round" />
        <path d="m24 35 7 5-4 11z" fill="#1d2440" stroke="#1d2440" stroke-width="3" stroke-linejoin="round" />
      </svg>

      <span class="blob" style="right: 70px; bottom: 60px; width: 64px; height: 64px; background: var(--sky)"></span>
      <span class="blob" style="right: 160px; bottom: 110px; width: 34px; height: 34px; background: var(--mint)"></span>
      <span class="blob" style="right: 40px; bottom: 150px; width: 22px; height: 22px; background: var(--sun)"></span>
    </div>
  </body>
</html>
